<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NDACC Button Test</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f6f4ef;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .box{width:min(420px,100%);background:#fff;border:1px solid #ddd;border-radius:20px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,.06)}
  h1{font-size:24px;margin:0 0 8px}
  .version{font-weight:800;margin-bottom:18px;color:#555}
  button{width:100%;min-height:52px;border:0;border-radius:14px;background:#111;color:#fff;font-size:17px;font-weight:800;cursor:pointer;touch-action:manipulation}
  #msg{margin-top:16px;font-size:18px;font-weight:800;min-height:28px}
</style>
</head>
<body>
<div class="box">
  <h1>NDACC BUTTON TEST</h1>
  <div class="version">VERSION: 2026-09-12-A</div>
  <button id="testBtn" type="button" onclick="document.getElementById('msg').textContent='BUTTON WORKS ✓'; this.textContent='CLICKED ✓';">CLICK TEST</button>
  <div id="msg"></div>
</div>
</body>
</html>
