<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nature's Dao Daily Settlement</title>
<style>
:root{--bg:#f5f4ef;--card:#fff;--line:#e6e3da;--text:#191919;--muted:#707070;--gold:#b58a2b;--soft:#faf8f2;--ok:#1f7a48;--danger:#b42318}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:1240px;margin:auto;padding:18px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.brand{font-size:26px;font-weight:800}.sub,.helper,label{font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.span3{grid-column:span 3}.span4{grid-column:span 4}.span8{grid-column:span 8}.span12{grid-column:span 12}
.metric-label{font-size:13px;color:var(--muted)}.metric-value{font-size:28px;font-weight:800;margin-top:5px}
.branch-toggle,.actions{display:flex;gap:10px;flex-wrap:wrap}
.branch-btn,.btn,.mini{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 14px;cursor:pointer;font-weight:700}
.branch-btn.active{background:#f5edd7;border-color:#d8bf7b}.branch-btn{flex:1;min-width:150px}
input,select{width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;padding:11px 12px;font-size:16px;color:var(--text)}
label{display:block;margin-bottom:5px;font-weight:600}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.row4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.status{padding:10px 12px;border-radius:12px;background:var(--soft);border:1px solid var(--line);font-size:13px}
.ok{color:var(--ok)}.bad{color:var(--danger)}
.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.day{border:1px solid var(--line);border-radius:10px;min-height:56px;padding:6px;background:#fff;cursor:pointer;text-align:center;font-size:12px}
.day strong{display:block}.day .review{display:flex;gap:3px;margin-top:5px}.day .review button{flex:1;border:1px solid var(--line);background:#fff;border-radius:7px;cursor:pointer}
table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid var(--line);font-size:13px;text-align:left;white-space:nowrap}.table-wrap{overflow:auto}
#jsState{font-size:12px;color:var(--ok);font-weight:700}
@media(max-width:900px){.span3,.span4,.span8,.span12{grid-column:span 12}.row,.row3,.row4{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div><div class="brand">天之道 Nature’s Dao</div><div class="sub">Daily Settlement</div></div>
    <div><div id="currentStatus" class="status">待验收</div><div id="jsState">系统载入中…</div></div>
  </div>

  <div class="grid">
    <div class="card span12">
      <div class="branch-toggle">
        <button type="button" class="branch-btn active" data-branch="Eco Botanic">Eco Botanic</button>
        <button type="button" class="branch-btn" data-branch="Nusa Bestari">Nusa Bestari</button>
      </div>
    </div>

    <div class="card span3"><div class="metric-label">当前日期</div><div id="metricDate" class="metric-value">-</div></div>
    <div class="card span3"><div class="metric-label">Grand Total</div><div id="metricGrandTotal" class="metric-value">RM 0.00</div></div>
    <div class="card span3"><div class="metric-label">本月营业额</div><div id="metricMonthTotal" class="metric-value">RM 0.00</div></div>
    <div class="card span3"><div class="metric-label">Petty Cash 剩余</div><div id="metricPetty" class="metric-value">RM 200.00</div></div>

    <div class="card span8">
      <div class="row3">
        <div><label>日期</label><input id="settlementDate" type="date"></div>
        <div><label>Staff / 员工</label><input id="staff" type="text" placeholder="例如：Amy"></div>
        <div><label>Cashier Balance</label><input id="cashierBalance" type="number" min="0" step="0.01" value="500"></div>
      </div>
      <input id="pettyOpening" type="hidden" value="200">

      <div style="height:14px"></div>
      <div class="row4">
        <div><label>VISA</label><input class="money-field" id="visa" type="number" min="0" step="0.01" value="0"></div>
        <div><label>MASTER</label><input class="money-field" id="master" type="number" min="0" step="0.01" value="0"></div>
        <div><label>AMEX</label><input class="money-field" id="amex" type="number" min="0" step="0.01" value="0"></div>
        <div><label>TNG</label><input class="money-field" id="tng" type="number" min="0" step="0.01" value="0"></div>
        <div><label>CASH</label><input class="money-field" id="cash" type="number" min="0" step="0.01" value="0"></div>
        <div><label>ZFB / ALIPAY</label><input class="money-field" id="alipay" type="number" min="0" step="0.01" value="0"></div>
        <div><label>Online Credit Card</label><input class="money-field" id="onlineCard" type="number" min="0" step="0.01" value="0"></div>
        <div><label>Bank Transfer</label><input class="money-field" id="bankTransfer" type="number" min="0" step="0.01" value="0"></div>
        <div><label>Tips</label><input class="money-field" id="tips" type="number" min="0" step="0.01" value="0"></div>
      </div>

      <div style="height:14px"></div>
      <div class="row">
        <div><label>Grand Total</label><input id="grandTotal" type="text" readonly></div>
        <div><label>Petty Cash 剩余</label><input id="pettyRemaining" type="text" readonly></div>
      </div>

      <div style="height:14px"></div>
      <div class="card" style="background:var(--soft)">
        <h3 style="margin-top:0">Petty Cash 进 / 出</h3>
        <div class="row3">
          <div><label>类型</label><select id="pettyType"><option value="out">出</option><option value="in">进</option></select></div>
          <div><label>原因</label><input id="pettyReason" type="text" placeholder="例如：买用品"></div>
          <div><label>数目 (RM)</label><input id="pettyAmount" type="number" min="0" step="0.01" value="0"></div>
        </div>
        <div class="actions" style="margin-top:10px"><button type="button" id="addPettyBtn" class="btn">加入 Petty Cash</button></div>
        <div class="table-wrap" style="margin-top:10px">
          <table><thead><tr><th>类型</th><th>原因</th><th>数目</th><th></th></tr></thead><tbody id="pettyBody"></tbody></table>
        </div>
      </div>
    </div>

    <div class="card span4">
      <label>月份</label><input id="reviewMonth" type="month">
      <div id="monthGrid" class="month-grid"></div>
      <div id="branchRecordState" class="helper" style="margin-top:10px;font-weight:700">Eco Botanic 独立记录</div><div id="autoSaveState" class="helper" style="margin-top:6px"></div>
    </div>

    <div class="card span12">
      <div class="topbar" style="margin-bottom:8px">
        <strong>历史记录</strong>
        <div class="actions">
          <button type="button" id="exportBtn" class="btn">导出 CSV</button>
          <button type="button" id="clearAllBtn" class="btn">清空当前分行记录</button>
        </div>
      </div>
      <div class="table-wrap">
        <table><thead><tr><th>日期</th><th>分行</th><th>Staff</th><th>Grand Total</th><th>Petty Cash</th><th>状态</th><th>操作</th></tr></thead><tbody id="historyBody"></tbody></table>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  function storageKey(){
    return currentBranch==="Nusa Bestari" ? "nd_daily_settlement_nusa_v1" : "nd_daily_settlement_eco_v1";
  }
  var currentBranch="Eco Botanic";
  var currentStatus="pending";
  var editingId=null;
  var pettyEntries=[];
  var paymentIds=["visa","master","amex","tng","cash","alipay","onlineCard","bankTransfer","tips"];

  function $(id){return document.getElementById(id);}
  function money(v){v=Number(v)||0;return "RM "+v.toLocaleString("en-MY",{minimumFractionDigits:2,maximumFractionDigits:2});}
  function numberOf(id){var el=$(id);return el ? Math.max(0,Number(el.value)||0) : 0;}
  function today(){
    var d=new Date();
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
  function read(){
    try{return JSON.parse(localStorage.getItem(storageKey())||"[]");}catch(e){return [];}
  }
  function write(rows){
    try{localStorage.setItem(storageKey(),JSON.stringify(rows));return true;}catch(e){alert("浏览器无法保存资料："+e.message);return false;}
  }
  function calc(){
    var total=0;
    paymentIds.forEach(function(id){total+=numberOf(id);});
    var pin=0,pout=0;
    pettyEntries.forEach(function(e){if(e.type==="in")pin+=Number(e.amount)||0;else pout+=Number(e.amount)||0;});
    var opening=Number($("pettyOpening").value)||200;
    var remaining=opening+pin-pout;
    $("grandTotal").value=money(total);
    $("pettyRemaining").value=money(remaining);
    $("metricGrandTotal").textContent=money(total);
    $("metricPetty").textContent=money(remaining);
    $("metricDate").textContent=$("settlementDate").value||"-";
    renderPetty();
    updateMonthTotal();
  }
  function formRecord(){
    var total=0;paymentIds.forEach(function(id){total+=numberOf(id);});
    var pin=0,pout=0;pettyEntries.forEach(function(e){if(e.type==="in")pin+=Number(e.amount)||0;else pout+=Number(e.amount)||0;});
    var opening=Number($("pettyOpening").value)||200;
    var r={
      id:editingId||Date.now(),date:$("settlementDate").value,branch:currentBranch,status:currentStatus,
      staff:$("staff").value.trim(),cashierBalance:numberOf("cashierBalance"),grandTotal:total,pettyOpening:opening,
      pettyIn:pin,pettyOut:pout,pettyNet:opening+pin-pout,pettyEntries:pettyEntries.slice()
    };
    paymentIds.forEach(function(id){r[id]=numberOf(id);});
    return r;
  }
  function save(silent){
    var r=formRecord(),rows=read(),i=-1;
    for(var x=0;x<rows.length;x++){if(rows[x].id===r.id || (rows[x].date===r.date)){i=x;break;}}
    if(i>=0){r.id=rows[i].id;rows[i]=r;}else{rows.push(r);}
    if(write(rows)){editingId=r.id;renderHistory();renderMonth();updateMonthTotal();if(!silent)alert("已保存");}
  }
  var timer=null;
  function autosave(){
    $("autoSaveState").textContent="正在自动保存…";
    if(timer)clearTimeout(timer);
    timer=setTimeout(function(){save(true);$("autoSaveState").textContent="已自动保存";},300);
  }
  function blankForDate(date){
    editingId=null;currentStatus="pending";pettyEntries=[];
    $("settlementDate").value=date;
    $("staff").value="";$("cashierBalance").value=500;
    paymentIds.forEach(function(id){$(id).value=0;});
    var rowsForCarry=read().filter(function(r){return r.date<date;}).sort(function(a,b){return b.date.localeCompare(a.date);});
    $("pettyOpening").value=rowsForCarry.length ? Number(rowsForCarry[0].pettyNet||200) : 200;
    $("pettyType").value="out";$("pettyReason").value="";$("pettyAmount").value=0;
    $("currentStatus").textContent="待验收";
    calc();
  }
  function loadRecord(r){
    editingId=r.id;currentStatus=r.status||"pending";currentBranch=r.branch;
    document.querySelectorAll(".branch-btn").forEach(function(b){b.classList.toggle("active",b.getAttribute("data-branch")===currentBranch);});
    $("settlementDate").value=r.date;$("staff").value=r.staff||"";$("cashierBalance").value=r.cashierBalance||0;
    paymentIds.forEach(function(id){$(id).value=r[id]||0;});
    $("pettyOpening").value=r.pettyOpening||200;
    pettyEntries=Array.isArray(r.pettyEntries)?r.pettyEntries.slice():[];
    $("currentStatus").textContent=currentStatus==="accepted"?"✓ 正确":currentStatus==="adjust"?"✕ 不正确":"待验收";
    calc();
  }
  function loadDate(date){
    var rows=read(),found=null;
    for(var i=0;i<rows.length;i++){
      if(rows[i].date===date){
        found=rows[i];
        break;
      }
    }
    if(found) loadRecord(found);
    else blankForDate(date);
  }

  function loadToday(){
    loadDate(today());
  }
  function renderPetty(){
    var body=$("pettyBody");body.innerHTML="";
    if(!pettyEntries.length){body.innerHTML='<tr><td colspan="4">还没有记录。</td></tr>';return;}
    pettyEntries.forEach(function(e,index){
      var tr=document.createElement("tr");
      tr.innerHTML="<td>"+(e.type==="in"?"进":"出")+"</td><td>"+(e.reason||"-")+"</td><td>"+money(e.amount)+"</td><td><button type='button' class='mini' data-del='"+index+"'>删除</button></td>";
      body.appendChild(tr);
    });
    body.querySelectorAll("[data-del]").forEach(function(btn){btn.addEventListener("click",function(){pettyEntries.splice(Number(btn.getAttribute("data-del")),1);calc();autosave();});});
  }
  function renderHistory(){
    var rows=read().sort(function(a,b){return (b.date+b.branch).localeCompare(a.date+a.branch);});
    var body=$("historyBody");body.innerHTML="";
    if(!rows.length){body.innerHTML='<tr><td colspan="7">还没有记录。</td></tr>';return;}
    rows.forEach(function(r){
      var tr=document.createElement("tr");
      tr.innerHTML="<td>"+r.date+"</td><td>"+r.branch+"</td><td>"+(r.staff||"-")+"</td><td>"+money(r.grandTotal)+"</td><td>"+money(r.pettyNet)+"</td><td>"+(r.status==="accepted"?"✓ 正确":r.status==="adjust"?"✕ 不正确":"待验收")+"</td><td><button type='button' class='mini' data-open='"+r.id+"'>打开</button></td>";
      body.appendChild(tr);
    });
    body.querySelectorAll("[data-open]").forEach(function(btn){btn.addEventListener("click",function(){var id=Number(btn.getAttribute("data-open")),rows=read();for(var i=0;i<rows.length;i++){if(rows[i].id===id){loadRecord(rows[i]);break;}}});});
  }
  function updateMonthTotal(){
    var ym=($("settlementDate").value||today()).slice(0,7),sum=0,rows=read();
    rows.forEach(function(r){if(r.date.indexOf(ym)===0)sum+=Number(r.grandTotal)||0;});
    $("metricMonthTotal").textContent=money(sum);
  }
  function renderMonth(){
    var ym=$("reviewMonth").value||today().slice(0,7);$("reviewMonth").value=ym;
    var parts=ym.split("-"),days=new Date(Number(parts[0]),Number(parts[1]),0).getDate(),rows=read();
    var grid=$("monthGrid");grid.innerHTML="";
    for(var d=1;d<=days;d++){
      (function(day){
        var date=ym+"-"+String(day).padStart(2,"0"),rec=null;
        for(var i=0;i<rows.length;i++){if(rows[i].date===date){rec=rows[i];break;}}
        var cell=document.createElement("div");cell.className="day";
        cell.innerHTML="<strong>"+day+"</strong><span>"+(rec?(rec.status==="accepted"?"✓ 正确":rec.status==="adjust"?"✕ 不正确":"待验收"):"未填写")+"</span>";
        if(rec){
          var review=document.createElement("div");review.className="review";
          var yes=document.createElement("button");yes.type="button";yes.textContent="✓";
          var no=document.createElement("button");no.type="button";no.textContent="✕";
          yes.addEventListener("click",function(e){e.stopPropagation();setReview(rec.id,"accepted");});
          no.addEventListener("click",function(e){e.stopPropagation();setReview(rec.id,"adjust");});
          review.appendChild(yes);review.appendChild(no);cell.appendChild(review);
          cell.addEventListener("click",function(){loadRecord(rec);});
        }else{
          cell.addEventListener("click",function(){blankForDate(date);});
        }
        grid.appendChild(cell);
      })(d);
    }
  }
  function setReview(id,status){
    var rows=read();
    for(var i=0;i<rows.length;i++){if(rows[i].id===id){rows[i].status=status;break;}}
    write(rows);renderHistory();renderMonth();
    if(editingId===id){currentStatus=status;$("currentStatus").textContent=status==="accepted"?"✓ 正确":"✕ 不正确";}
  }
  function exportCsv(){
    var rows=read();if(!rows.length){alert("目前没有记录");return;}
    var cols=["date","branch","staff","cashierBalance","visa","master","amex","tng","cash","alipay","onlineCard","bankTransfer","tips","grandTotal","pettyNet","status"];
    var lines=[cols.join(",")];
    rows.forEach(function(r){lines.push(cols.map(function(k){return '"'+String(r[k]==null?"":r[k]).replace(/"/g,'""')+'"';}).join(","));});
    var blob=new Blob(["\ufeff"+lines.join("\n")],{type:"text/csv;charset=utf-8"});
    var url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="NatureDao_Daily_Settlement.csv";document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
  }

  try{
    $("settlementDate").value=today();$("reviewMonth").value=today().slice(0,7);$("branchRecordState").textContent=currentBranch+" 独立记录";
    document.querySelectorAll(".branch-btn").forEach(function(btn){btn.addEventListener("click",function(){
      currentBranch=btn.getAttribute("data-branch");
      document.querySelectorAll(".branch-btn").forEach(function(b){b.classList.toggle("active",b===btn);});
      $("branchRecordState").textContent=currentBranch+" 独立记录";
      loadToday();
      $("reviewMonth").value=$("settlementDate").value.slice(0,7);
      renderHistory();
      renderMonth();
      updateMonthTotal();
    });});
    document.querySelectorAll("input").forEach(function(el){
      if(el.id!=="reviewMonth" && el.id!=="settlementDate"){
        el.addEventListener("input",function(){calc();autosave();});
      }
    });
    $("settlementDate").addEventListener("change",function(){
      var chosen=$("settlementDate").value;
      if(!chosen) return;
      loadDate(chosen);
      $("reviewMonth").value=chosen.slice(0,7);
      renderMonth();
    });
    $("reviewMonth").addEventListener("change",renderMonth);
    $("pettyType").addEventListener("change",function(){if($("pettyType").value==="in")$("pettyReason").value="";});
    $("addPettyBtn").addEventListener("click",function(){var amount=numberOf("pettyAmount"),type=$("pettyType").value,reason=$("pettyReason").value.trim();if(amount<=0){alert("请输入数目");return;}if(type==="out"&&!reason){alert("请填写出款原因");return;}pettyEntries.push({type:type,amount:amount,reason:reason});$("pettyAmount").value=0;$("pettyReason").value="";calc();autosave();});
    $("exportBtn").addEventListener("click",exportCsv);
    $("clearAllBtn").addEventListener("click",function(){if(confirm("确定清空当前分行记录？")){localStorage.removeItem(storageKey());loadToday();renderHistory();renderMonth();}});
    renderHistory();renderMonth();loadToday();
    $("jsState").textContent="系统已载入 ✓ · Eco / Nusa 独立记录 · Staff";
  }catch(err){
    $("jsState").textContent="系统错误："+err.message;
    $("jsState").className="bad";
    alert("网页程式发生错误："+err.message);
  }
})();
</script>
</body>
</html>
